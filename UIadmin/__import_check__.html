<!doctype html>
<html><body><pre id="out">running...</pre>
<script type="module">
  const out = document.getElementById('out');
  const checks = [
    '/src/app/data/mockData.ts',
    '/src/app/pages/Dashboard.tsx',
    '/src/app/routes.tsx',
    '/src/app/App.tsx'
  ];
  (async () => {
    const lines = [];
    for (const p of checks) {
      try {
        await import('http://localhost:5173' + p + '?t=' + Date.now());
        lines.push('OK ' + p);
      } catch (e) {
        lines.push('ERR ' + p + ' :: ' + (e && e.message ? e.message : String(e)));
      }
    }
    out.textContent = lines.join('\n');
  })();
</script></body></html>
