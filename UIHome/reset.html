<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Đặt lại mật khẩu</h1>
          <p>Nhập mật khẩu mới của bạn</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="resetForm" novalidate>
          <input type="hidden" id="token" />

          <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <div class="input-icon-wrap">
              <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
              <button type="button" class="toggle-pw" data-target="newPassword">👁</button>
            </div>
            <span class="field-error" id="newPasswordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <div class="input-icon-wrap">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Nhập lại mật khẩu mới"
                autocomplete="new-password"
              />
              <button type="button" class="toggle-pw" data-target="confirmPassword">👁</button>
            </div>
            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Đặt lại mật khẩu</button>
        </form>

        <div class="auth-links">
          <a href="index.html">← Quay lại đăng nhập</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      // Lấy token từ query string: ?token=xxx
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        UI.alert("Link không hợp lệ hoặc đã hết hạn.", "error");
        document.getElementById("submitBtn").disabled = true;
      } else {
        document.getElementById("token").value = token;
      }

      document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        UI.clearErrors();

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const tokenValue = document.getElementById("token").value;

        let valid = true;
        if (!newPassword || newPassword.length < 6) {
          UI.fieldError("newPasswordError", "Mật khẩu tối thiểu 6 ký tự");
          valid = false;
        }
        if (newPassword !== confirmPassword) {
          UI.fieldError("confirmPasswordError", "Mật khẩu không khớp");
          valid = false;
        }
        if (!valid) return;

        UI.loading(true);
        try {
          const data = await API.resetPassword({ token: tokenValue, newPassword, confirmPassword });
          UI.alert(data.message || "Đặt lại mật khẩu thành công!", "success");
          setTimeout(() => (window.location.href = "index.html"), 2000);
        } catch (err) {
          UI.alert(err.message || "Có lỗi xảy ra", "error");
        } finally {
          UI.loading(false);
        }
      });

      UI.initPasswordToggle();
    </script>
  </body>
</html>
