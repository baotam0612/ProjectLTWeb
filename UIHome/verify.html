<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác nhận Email</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Xác nhận Email</h1>
          <p id="subTitle">Đang xử lý xác nhận...</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div id="loadingMsg" style="text-align: center; padding: 20px; color: #555">Vui lòng chờ...</div>

        <div class="auth-links" style="margin-top: 16px">
          <a href="index.html">← Quay lại đăng nhập</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const loadingMsg = document.getElementById("loadingMsg");
        const subTitle = document.getElementById("subTitle");

        if (!token) {
          loadingMsg.style.display = "none";
          subTitle.textContent = "Link không hợp lệ";
          UI.alert("Link xác nhận không hợp lệ hoặc đã hết hạn.", "error");
          return;
        }

        try {
          const data = await API.verifyEmail(token);
          loadingMsg.style.display = "none";
          subTitle.textContent = "Xác nhận thành công!";
          UI.alert((data.message || "Email đã được xác nhận!") + " Bạn có thể đăng nhập ngay bây giờ.", "success");
        } catch (err) {
          loadingMsg.style.display = "none";
          subTitle.textContent = "Xác nhận thất bại";
          UI.alert(err.message || "Link không hợp lệ hoặc đã hết hạn.", "error");
        }
      })();
    </script>
  </body>
</html>
