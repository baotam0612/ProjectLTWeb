<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./css/base.css?v=20260413-2338">
    <link rel="stylesheet" href="./css/sanpham.css?v=20260413-2338">
    <link rel="stylesheet" href="./css/giohang.css?v=20260413-2338">
    <title>Giỏ hàng | SHYNE</title>
</head>
<body>
    <div data-include="header.html"></div>

    <section class="cart-section">
        <div class="container">
            <div class="cart-head">
                <h2>Giỏ hàng của bạn</h2>
                <a href="sanpham.html" class="cart-link-back">Tiếp tục mua sắm</a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div id="cartItems" class="cart-items-wrap"></div>
                </div>
                <div class="col-lg-4">
                    <div class="cart-summary">
                        <h4>Tổng đơn</h4>
                        <div class="cart-summary-line">
                            <span>Tạm tính</span>
                            <strong id="cartSubtotal">0 VND</strong>
                        </div>
                        <div class="cart-summary-line">
                            <span>Phí vận chuyển</span>
                            <strong>0 VND</strong>
                        </div>
                        <div class="cart-summary-total">
                            <span>Thành tiền</span>
                            <strong id="cartTotal">0 VND</strong>
                        </div>
                        <div class="cart-address-wrap">
                            <label for="shippingAddressInput" class="cart-address-label">Địa chỉ giao hàng</label>
                            <textarea id="shippingAddressInput" class="cart-address-input" rows="3" placeholder="Nhập địa chỉ giao hàng..."></textarea>
                        </div>
                        <div class="cart-address-wrap">
                            <label for="paymentMethodInput" class="cart-address-label">Phương thức thanh toán</label>
                            <select id="paymentMethodInput" class="cart-address-input" style="padding: 8px; margin-bottom: 15px;">
                                <option value="Thanh toán khi nhận hàng">Thanh toán khi nhận hàng (COD)</option>
                            </select>
                        </div>

                        <div class="cart-summary-actions">
                            <button id="clearCartBtn" class="btn btn-outline-secondary btn-block">Xóa giỏ hàng</button>
                            <button id="checkoutBtn" class="btn btn-primary btn-block">Đặt toàn bộ</button>
                        </div>
                        <p id="cartStatus" class="cart-status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div data-include="footer.html"></div>

    <script>
        async function includeHTML() {
            const elements = document.querySelectorAll("[data-include]");
            for (const el of elements) {
                const file = el.getAttribute("data-include");
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        const data = await response.text();
                        el.innerHTML = data;
                        el.removeAttribute("data-include");
                    }
                } catch (error) {
                    console.error("Lỗi tải giao diện:", file, error);
                }
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML();
            if (typeof UI !== "undefined") UI.syncAdminLinks();
        });
    </script>
    <script src="./js/giohang-data.js?v=20260413-2338"></script>
</body>
</html>
