<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/base.css?v=20260413-2338">
    <link rel="stylesheet" href="./css/sanpham.css?v=20260413-2338">
    <title>Sản phẩm | SHYNE</title>
  </head>
  <body>
    <div data-include="header.html"></div>
    <div class="section-one"></div>

    <div class="section-two">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <div class="inner-header">
              <h2>Các mặt hàng</h2>
            </div>
          </div>
        </div>
        <div class="row" id="products">
          <!-- Dữ liệu sản phẩm sẽ được JavaScript đổ vào đây -->
        </div>
      </div>
    </div>

    <div id="orderOverlay" class="order-overlay">
      <div class="order-modal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
        <button type="button" class="order-close" id="closeOrderModalBtn" aria-label="Đóng">x</button>
        <h3 id="orderModalTitle">Đặt hàng</h3>
        <div class="order-summary-box">
          <p id="orderProductName" class="order-product-name"></p>
          <div class="order-summary-line">
            <span>Đơn giá</span>
            <strong id="orderUnitPrice">0 VND</strong>
          </div>
          <div class="order-summary-line">
            <span>Tạm tính</span>
            <strong id="orderSubtotal">0 VND</strong>
          </div>
        </div>

        <label for="orderQuantity" class="order-label">Số lượng</label>
        <input type="number" id="orderQuantity" class="order-input" value="1" min="1" step="1">

        <label for="shippingAddress" class="order-label">Địa chỉ nhận hàng</label>
        <textarea id="shippingAddress" class="order-input order-textarea" placeholder="Nhập địa chỉ giao hàng..." rows="3"></textarea>

        <p id="orderStatusMessage" class="order-status-message" aria-live="polite"></p>

        <div class="order-modal-footer">
          <button type="button" class="btn-cancel" id="cancelOrderBtn">Hủy</button>
          <button type="button" class="btn-confirm" id="confirmOrderBtn">Xác nhận đặt hàng</button>
        </div>
      </div>
    </div>

    <div data-include="footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <script>
      async function includeHTML() {
        const elements = document.querySelectorAll("[data-include]");
        for (const el of elements) {
          const file = el.getAttribute("data-include");
          try {
            const response = await fetch(file);
            if (response.ok) {
              const data = await response.text();
              el.innerHTML = data;
              el.removeAttribute("data-include");
            } else {
              console.error(`Không thể nạp file: ${file}`);
            }
          } catch (error) {
            console.error("Lỗi khi lắp ghép giao diện:", error);
          }
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await includeHTML();
        if (typeof UI !== "undefined") UI.syncAdminLinks();
      });
    </script>
    <script src="./js/sanpham-data.js?v=20260413-2338"></script>
  </body>
</html>
