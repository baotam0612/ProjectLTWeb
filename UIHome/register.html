<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Tạo tài khoản</h1>
          <p>Điền thông tin để đăng ký</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Tối thiểu 3 ký tự" autocomplete="username" />
            <span class="field-error" id="usernameError"></span>
          </div>

          <div class="form-group">
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" placeholder="Nguyễn Văn A" />
            <span class="field-error" id="fullNameError"></span>
          </div>

          <div class="form-group">
            <label for="address">Địa chỉ</label>
            <input type="text" id="address" placeholder="Hà Nội, Việt Nam" />
            <span class="field-error" id="addressError"></span>
          </div>

          <div class="form-group">
            <label for="phoneNumber">Số điện thoại</label>
            <input type="text" id="phoneNumber" placeholder="0123456789" />
            <span class="field-error" id="phoneNumberError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email" />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-icon-wrap">
              <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
              <button type="button" class="toggle-pw" data-target="password">👁</button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <div class="input-icon-wrap">
              <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
              <button type="button" class="toggle-pw" data-target="confirmPassword">👁</button>
            </div>
            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Đăng ký</button>
        </form>

        <div class="auth-links">
          <span>Đã có tài khoản?</span>
          <a href="index.html">Đăng nhập</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        UI.clearErrors();

        const username = document.getElementById("username").value.trim();
        const fullName = document.getElementById("fullName").value.trim();
        const address = document.getElementById("address").value.trim();
        const phoneNumber = document.getElementById("phoneNumber").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        let valid = true;
        if (!username || username.length < 3) {
          UI.fieldError("usernameError", "Tên đăng nhập tối thiểu 3 ký tự");
          valid = false;
        }
        if (!fullName) {
          UI.fieldError("fullNameError", "Vui lòng nhập họ tên");
          valid = false;
        }
        if (!address) {
          UI.fieldError("addressError", "Vui lòng nhập địa chỉ");
          valid = false;
        }
        if (!phoneNumber) {
          UI.fieldError("phoneNumberError", "Vui lòng nhập số điện thoại");
          valid = false;
        }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          UI.fieldError("emailError", "Email không hợp lệ");
          valid = false;
        }
        if (!password || password.length < 6) {
          UI.fieldError("passwordError", "Mật khẩu tối thiểu 6 ký tự");
          valid = false;
        }
        if (password !== confirmPassword) {
          UI.fieldError("confirmPasswordError", "Mật khẩu không khớp");
          valid = false;
        }
        if (!valid) return;

        UI.loading(true);
        try {
          const data = await API.register({ username, fullName, address, phoneNumber, email, password });
          UI.alert(data.message || "Đăng ký thành công! Vui lòng kiểm tra email để xác nhận tài khoản.", "success");
          document.getElementById("registerForm").reset();
        } catch (err) {
          UI.alert(err.message || "Đăng ký thất bại", "error");
        } finally {
          UI.loading(false);
        }
      });

      UI.initPasswordToggle();
    </script>
  </body>
</html>
