<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Quên mật khẩu?</h1>
          <p>Nhập email để nhận link đặt lại mật khẩu</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email tài khoản" autocomplete="email" />
            <span class="field-error" id="emailError"></span>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Gửi link đặt lại</button>
        </form>

        <div class="auth-links">
          <a href="index.html">← Quay lại đăng nhập</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        UI.clearErrors();

        const email = document.getElementById("email").value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          UI.fieldError("emailError", "Email không hợp lệ");
          return;
        }

        UI.loading(true);
        try {
          const data = await API.forgotPassword({ email });
          UI.alert(data.message || "Vui lòng kiểm tra email của bạn!", "success");
          document.getElementById("forgotForm").reset();
        } catch (err) {
          UI.alert(err.message || "Có lỗi xảy ra", "error");
        } finally {
          UI.loading(false);
        }
      });
    </script>
  </body>
</html>
