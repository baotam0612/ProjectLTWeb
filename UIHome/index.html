<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Chào mừng trở lại</h1>
          <p>Đăng nhập để tiếp tục</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" />
            <span class="field-error" id="usernameError"></span>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-icon-wrap">
              <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" />
              <button type="button" class="toggle-pw" data-target="password">👁</button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Đăng nhập</button>
        </form>

        <div class="auth-links">
          <a href="forgot.html">Quên mật khẩu?</a>
          <span>·</span>
          <a href="register.html">Tạo tài khoản mới</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      // Redirect if already logged in
      if (Auth.getToken()) {
        const roles = Auth.getRoles();
        if (roles.includes("ROLE_ADMIN")) window.location.href = "http://localhost:5173";
        else window.location.href = "user.html";
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        UI.clearErrors();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        let valid = true;
        if (!username) {
          UI.fieldError("usernameError", "Vui lòng nhập tên đăng nhập");
          valid = false;
        }
        if (!password) {
          UI.fieldError("passwordError", "Vui lòng nhập mật khẩu");
          valid = false;
        }
        if (!valid) return;

        UI.loading(true);
        try {
          const data = await API.login({ username, password });
          Auth.saveSession(data);
          if (Auth.getRoles().includes("ROLE_ADMIN")) {
            // Chuyển hướng tới giao diện quản trị ReactJS đang chạy 
            window.location.href = "http://localhost:5173";
          } else {
            window.location.href = "user.html";
          }
        } catch (err) {
          UI.alert(err.message || "Đăng nhập thất bại", "error");
        } finally {
          UI.loading(false);
        }
      });

      UI.initPasswordToggle();
    </script>
  </body>
</html>
