<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/sanpham.css">
    <title>Hello, world!</title>
  </head>
  <body>
    
    <div data-include="header.html"></div>
    <div class="section-one"> </div>
    <div class="section-two">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="inner-header">
                        <h2>Các mặt hàng</h2>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-4">
                    <div class="inner-box">
                        <div class="inner-img">
                            <img src="" alt="">
                        </div>
                        <div class="inner-content">
                            <div class="inner-name">Tên: </div>
                            <div class="inner-desc"></div>
                            <div class="inner-gia">Giá: </div>
                            <div class="inner-status">Trạng thái: </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div data-include="footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    
    <script>
        async function includeHTML() {
        // 1. Tìm tất cả các thẻ có thuộc tính "data-include"
        const elements = document.querySelectorAll("[data-include]");
        
        // 2. Lặp qua từng phần tử để xử lý
        for (const el of elements) {
            const file = el.getAttribute("data-include");
            
            try {
                // 3. Sử dụng fetch để lấy nội dung file
                const response = await fetch(file);
                
                if (response.ok) {
                    const data = await response.text();
                    // 4. Chèn nội dung vào thẻ
                    el.innerHTML = data;
                    // 5. Xóa thuộc tính để tránh nạp lại nhiều lần
                    el.removeAttribute("data-include");
                } else {
                    console.error(`Không thể nạp file: ${file}`);
                }
            } catch (error) {
                console.error("Lỗi khi lắp ghép giao diện:", error);
            }
        }
        }

        // Chạy hàm ngay khi toàn bộ cấu trúc trang được tải xong
        document.addEventListener("DOMContentLoaded", includeHTML);
    </script>

</body>   
</html>
